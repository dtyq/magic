<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Magic HTML Sandbox</title>
		<script
			id="magic-iframe-runtime-inline"
			type="application/magic-runtime"
			data-runtime="true"
			data-encoding="base64"
		>
			__MAGIC_IFRAME_RUNTIME_INLINE_PLACEHOLDER__
		</script>
		<script>
			var runtimeLoadTimeoutMs = 10000
			// Capture the browser-provided parent reference before any runtime (such as
			// DevTools MessageProxy) can wrap window.parent.
			var trustedParentWindow = window.parent
			var trustedParentOrigin = ""
			try {
				if (window.location.ancestorOrigins && window.location.ancestorOrigins.length > 0)
					trustedParentOrigin = window.location.ancestorOrigins[0]
				else if (document.referrer) trustedParentOrigin = new URL(document.referrer).origin
			} catch (error) {
				trustedParentOrigin = ""
			}
			if (!trustedParentOrigin && window.parent === window)
				trustedParentOrigin = window.location.origin
			if (!trustedParentOrigin) {
				try {
					if (window.parent.location.origin === window.location.origin)
						trustedParentOrigin = window.location.origin
				} catch (error) {
					// Cross-origin parent with no usable referrer: fail closed.
				}
			}

			function isTrustedParentMessage(event) {
				if (!event || !trustedParentOrigin || event.source !== trustedParentWindow)
					return false
				return event.origin === trustedParentOrigin
			}

			function setupMessageListener() {
				// setContent 会替换文档并重新初始化 shell 处理逻辑。
				// 保留一个 window 级监听器，避免 FilesViewer 复用 iframe 时
				// 同一个导航请求被重复处理。
				window.removeEventListener("message", handleMessage)
				window.addEventListener("message", handleMessage)
			}

			function postToParent(message) {
				var navigation = window.__MAGIC_HTML_NAVIGATION__
				var enrichedMessage = message
				if (
					navigation &&
					navigation.requestId &&
					message &&
					message.navigationRequestId == null
				) {
					enrichedMessage = Object.assign({}, message, {
						navigationRequestId: navigation.requestId,
					})
				}
				if (!trustedParentOrigin) return
				window.parent.postMessage(enrichedMessage, trustedParentOrigin)
			}

			var HTML_SANDBOX_TELEMETRY_MESSAGE = "MAGIC_HTML_SANDBOX_TELEMETRY"
			var telemetrySequence = 0
			var telemetryDedupeCounts = {}
			var TELEMETRY_MAX_PER_DEDUPE_KEY = 5

			function nextTelemetryEventId() {
				telemetrySequence += 1
				return "sandbox_tel_" + Date.now() + "_" + telemetrySequence
			}

			function truncateTelemetryString(value, maxLength) {
				var text = value == null ? "" : String(value)
				if (text.length <= maxLength) return text
				return text.slice(0, maxLength) + "...[truncated]"
			}

			function sanitizeTelemetryText(value, maxLength) {
				var text = truncateTelemetryString(value, maxLength)
				if (!text) return ""

				try {
					var url = new URL(text, "http://sandbox.invalid")
					var sensitiveParams = [
						"token",
						"access_token",
						"signature",
						"x-oss-signature",
						"Expires",
					]
					for (var i = 0; i < sensitiveParams.length; i += 1) {
						if (url.searchParams.has(sensitiveParams[i])) {
							url.searchParams.set(sensitiveParams[i], "[redacted]")
						}
					}

					var serialized = url.toString()
					return text.indexOf("http") === 0
						? serialized
						: serialized.replace("http://sandbox.invalid", "")
				} catch (e) {
					return text.replace(
						/([?&](?:token|access_token|signature|x-oss-signature|Expires)=)[^&#\s]+/gi,
						"$1[redacted]",
					)
				}
			}

			function getTelemetryPage() {
				return {
					href: window.location && window.location.href ? window.location.href : "",
					referrer: document.referrer || "",
					readyState: document.readyState || "loading",
				}
			}

			function getTelemetrySource() {
				var chainFileIds = Array.isArray(window.__MAGIC_IFRAME_CHAIN__)
					? window.__MAGIC_IFRAME_CHAIN__.slice()
					: []
				var fileId = window.__MAGIC_FILE_ID__ || ""
				var depth = chainFileIds.length

				return {
					depth: depth,
					fileId: fileId,
					path: window.__MAGIC_RELATIVE_PATH__ || "",
					chainFileIds: chainFileIds,
				}
			}

			function createTelemetryDedupeKey(event) {
				if (!event || !event.type) return ""
				if (event.type === "runtime_error") {
					return [
						event.type,
						event.errorType || "",
						event.message || "",
						event.source || "",
						event.lineno || "",
						event.colno || "",
					].join("|")
				}
				if (event.type === "resource_load_failed") {
					return [event.type, event.resourceType || "", event.url || ""].join("|")
				}
				return event.type
			}

			function sendTelemetryToParent(event, options) {
				var dedupeKey = (options && options.dedupeKey) || createTelemetryDedupeKey(event)
				var dedupeCount = dedupeKey ? (telemetryDedupeCounts[dedupeKey] || 0) + 1 : 1
				if (dedupeKey) telemetryDedupeCounts[dedupeKey] = dedupeCount
				if (dedupeCount > TELEMETRY_MAX_PER_DEDUPE_KEY) return

				try {
					postToParent({
						type: HTML_SANDBOX_TELEMETRY_MESSAGE,
						payload: {
							eventId: nextTelemetryEventId(),
							severity: (options && options.severity) || "error",
							event: event,
							source: getTelemetrySource(),
							page: getTelemetryPage(),
							timestamp: Date.now(),
							dedupeKey: dedupeKey,
							dedupeCount: dedupeCount,
						},
					})
				} catch (e) {
					console.error("Failed to send sandbox telemetry to parent:", e)
				}
			}

			function sendRuntimeErrorTelemetry(payload) {
				sendTelemetryToParent({
					type: "runtime_error",
					errorType: payload.errorType || "error",
					message: sanitizeTelemetryText(
						payload.message || payload.detail || "Unknown runtime error",
						500,
					),
					stack: sanitizeTelemetryText(payload.stack || "", 2000),
					source: sanitizeTelemetryText(payload.source || "", 1000),
					lineno: payload.lineno,
					colno: payload.colno,
					detail: sanitizeTelemetryText(payload.detail || "", 1000),
					runtimeUrl: sanitizeTelemetryText(payload.runtimeUrl || "", 1000),
				})
			}

			function resetTelemetryDedupe() {
				telemetryDedupeCounts = {}
			}

			function decodeBase64Utf8(base64Source) {
				var binary = window.atob(base64Source)
				var bytes = new Uint8Array(binary.length)
				for (var i = 0; i < binary.length; i += 1) {
					bytes[i] = binary.charCodeAt(i)
				}

				if (window.TextDecoder) {
					return new TextDecoder("utf-8").decode(bytes)
				}

				var escaped = ""
				for (var j = 0; j < bytes.length; j += 1) {
					escaped += "%" + ("00" + bytes[j].toString(16)).slice(-2)
				}
				return decodeURIComponent(escaped)
			}

			function installInlineRuntime() {
				if (window.MagicHtmlSandboxRuntime) {
					return true
				}

				var runtimeData = document.getElementById("magic-iframe-runtime-inline")
				var encodedRuntimeSource = runtimeData ? runtimeData.textContent || "" : ""
				encodedRuntimeSource = encodedRuntimeSource.replace(/\s+/g, "")
				if (!encodedRuntimeSource) {
					return false
				}

				try {
					// Keep bundled runtime bytes out of an executable HTML script block so
					// template literals, raw newlines, and closing script text cannot break
					// the shell syntax before the iframe gets a chance to install runtime.
					var runtimeScript = document.createElement("script")
					runtimeScript.setAttribute("data-runtime", "true")
					runtimeScript.setAttribute("data-runtime-executable", "true")
					runtimeScript.textContent = decodeBase64Utf8(encodedRuntimeSource)
					document.head.appendChild(runtimeScript)
					return !!window.MagicHtmlSandboxRuntime
				} catch (error) {
					console.error("[RenderSite] inline runtime install failed", error)
					sendRuntimeErrorTelemetry({
						errorType: "runtimeInlineInstall",
						message: "inline iframe runtime install failed",
						detail: error && error.message ? error.message : String(error),
					})
					return false
				}
			}

			// Runtime installation is deferred until the first setContent message.
			// The host can then provide its own environment-specific runtime bundle
			// while older hosts continue to use this shell's inline bundle.

			function setupErrorHandler() {
				window.onerror = function (message, source, lineno, colno, error) {
					sendRuntimeErrorTelemetry({
						errorType: "error",
						message: message,
						source: source || "",
						lineno: lineno,
						colno: colno,
						stack: error && error.stack ? error.stack : "",
					})
					return false
				}
				window.addEventListener("unhandledrejection", function (event) {
					var reason = event.reason
					var message =
						typeof reason === "string"
							? reason
							: (reason && reason.message) || "Unknown promise rejection"
					var stack = reason && reason.stack ? reason.stack : ""
					sendRuntimeErrorTelemetry({
						errorType: "unhandledrejection",
						message: message,
						stack: stack,
					})
				})
				window.addEventListener(
					"error",
					function (event) {
						var target = event && event.target
						if (!target || target === window) return

						var tagName = target.tagName ? String(target.tagName).toLowerCase() : ""
						var url =
							target.currentSrc ||
							target.src ||
							target.href ||
							target.data ||
							target.poster ||
							""
						if (!tagName || !url) return

						var resourceType = "unknown"
						if (tagName === "script") resourceType = "script"
						else if (tagName === "link") resourceType = "stylesheet"
						else if (tagName === "img") resourceType = "image"
						else if (tagName === "iframe") resourceType = "iframe"
						else if (tagName === "video" || tagName === "audio" || tagName === "source")
							resourceType = "media"

						sendTelemetryToParent({
							type: "resource_load_failed",
							tagName: tagName,
							url: sanitizeTelemetryText(url, 1000),
							resourceType: resourceType,
						})
					},
					true,
				)
			}

			var isAnimationPaused = false
			var runtimeState = {
				loaded: false,
				loading: false,
				runtimeUrl: "",
				failedRuntimeUrl: "",
				loadingPromise: null,
			}

			function cleanupEditRuntime() {
				if (window.__iframeEditorRuntime__) {
					try {
						window.__iframeEditorRuntime__.destroy()
					} catch (e) {
						console.warn("清理旧的 EditorRuntime 失败:", e)
					}
					delete window.__iframeEditorRuntime__
				}

				if (window.__elementSelectorV2__) {
					try {
						window.__elementSelectorV2__.destroy()
					} catch (e) {
						console.warn("清理旧的 ElementSelector 失败:", e)
					}
					delete window.__elementSelectorV2__
				}

				if (window.__editingAPIV2__) delete window.__editingAPIV2__

				if (
					window.__editorBridge__ &&
					window.__editorBridge__.constructor.name === "SimpleEditorBridge"
				) {
					try {
						window.__editorBridge__.destroy()
					} catch (e) {
						console.warn("清理旧的 EditorBridge 失败:", e)
					}
					delete window.__editorBridge__
				}

				if (window.__EDITING_FEATURES_V2_INJECTED__)
					delete window.__EDITING_FEATURES_V2_INJECTED__
			}

			function restartInlineRuntime() {
				if (
					!window.MagicHtmlSandboxRuntime ||
					typeof window.MagicHtmlSandboxRuntime.startIframeRuntime !== "function"
				) {
					return false
				}

				try {
					window.MagicHtmlSandboxRuntime.startIframeRuntime()
				} catch (error) {
					console.error("[RenderSite] runtime restart failed", error)
					sendRuntimeErrorTelemetry({
						errorType: "runtimeRestart",
						message: "iframe runtime restart failed",
						detail: error && error.message ? error.message : String(error),
					})
					return false
				}
				return true
			}

			function clearRuntimeGlobal() {
				try {
					delete window.MagicHtmlSandboxRuntime
				} catch (error) {
					window.MagicHtmlSandboxRuntime = undefined
				}
			}

			function installInlineRuntimeAndStart(scaleRatio) {
				if (scaleRatio !== undefined && scaleRatio !== null)
					window.__MAGIC_SCALE_RATIO__ = scaleRatio || 1

				if (window.MagicHtmlSandboxRuntime && restartInlineRuntime()) {
					runtimeState.loaded = true
					runtimeState.loading = false
					runtimeState.runtimeUrl = ""
					return true
				}
				if (window.MagicHtmlSandboxRuntime) clearRuntimeGlobal()
				if (!installInlineRuntime() || !restartInlineRuntime()) {
					runtimeState.loaded = false
					runtimeState.loading = false
					runtimeState.runtimeUrl = ""
					return false
				}
				runtimeState.loaded = true
				runtimeState.loading = false
				runtimeState.runtimeUrl = ""
				return true
			}

			function loadIframeRuntime(runtimeUrl, scaleRatio) {
				if (scaleRatio !== undefined && scaleRatio !== null)
					window.__MAGIC_SCALE_RATIO__ = scaleRatio || 1

				if (!runtimeUrl) return Promise.resolve(installInlineRuntimeAndStart(scaleRatio))

				var parsedRuntimeUrl
				try {
					parsedRuntimeUrl = new URL(runtimeUrl, window.location.href)
				} catch (error) {
					return Promise.resolve(false)
				}
				if (
					!trustedParentOrigin ||
					parsedRuntimeUrl.origin !== trustedParentOrigin ||
					!parsedRuntimeUrl.pathname.endsWith("/husky-runtime.js") ||
					parsedRuntimeUrl.search ||
					parsedRuntimeUrl.hash ||
					(parsedRuntimeUrl.protocol !== "http:" &&
						parsedRuntimeUrl.protocol !== "https:")
				) {
					console.warn("[RenderSite] runtime URL rejected")
					return Promise.resolve(false)
				}
				runtimeUrl = parsedRuntimeUrl.toString()
				if (runtimeState.failedRuntimeUrl === runtimeUrl) return Promise.resolve(false)

				if (runtimeState.loaded && runtimeState.runtimeUrl === runtimeUrl) {
					if (restartInlineRuntime()) return Promise.resolve(true)
					runtimeState.loaded = false
					clearRuntimeGlobal()
					return Promise.resolve(installInlineRuntimeAndStart(scaleRatio))
				}

				if (runtimeState.loading && runtimeState.runtimeUrl === runtimeUrl) {
					return runtimeState.loadingPromise || Promise.resolve(false)
				}

				if (
					runtimeState.loaded &&
					runtimeState.runtimeUrl &&
					runtimeState.runtimeUrl !== runtimeUrl
				) {
					console.warn(
						"[RenderSite] runtime URL cannot change within one shell instance",
						{
							current: runtimeState.runtimeUrl,
							requested: runtimeUrl,
						},
					)
					return Promise.resolve(true)
				}

				cleanupEditRuntime()
				runtimeState.loading = true
				runtimeState.runtimeUrl = runtimeUrl
				runtimeState.loadingPromise = new Promise(function (resolve) {
					var settled = false
					var script = null
					var timeoutId = setTimeout(function () {
						if (settled) return
						runtimeState.loading = false
						runtimeState.failedRuntimeUrl = runtimeUrl
						if (script && script.parentNode) script.parentNode.removeChild(script)
						console.error("[RenderSite] runtime load timed out", {
							runtimeUrl: runtimeUrl,
						})
						sendRuntimeErrorTelemetry({
							errorType: "runtimeLoad",
							message: "iframe runtime script load timed out",
							runtimeUrl: runtimeUrl,
						})
						settle(false)
					}, runtimeLoadTimeoutMs)
					function settle(value) {
						if (settled) return
						settled = true
						clearTimeout(timeoutId)
						runtimeState.loadingPromise = null
						resolve(value)
					}

					try {
						script = document.createElement("script")
						script.setAttribute("data-runtime", "true")
						script.setAttribute("data-runtime-source", "host")
						script.async = true
						// The host runtime is served from the parent application's origin.
						// Explicit CORS mode is required for classic scripts loaded by the
						// cross-origin sandbox shell, especially in Vite dev environments.
						script.crossOrigin = "anonymous"
						script.src = runtimeUrl
						script.onload = function () {
							if (settled) return
							var runtimeStarted = restartInlineRuntime()
							runtimeState.loaded = runtimeStarted
							runtimeState.loading = false
							if (!runtimeState.loaded) {
								console.error(
									"[RenderSite] runtime loaded without global runtime",
									{
										runtimeUrl: runtimeUrl,
									},
								)
								runtimeState.failedRuntimeUrl = runtimeUrl
								if (script.parentNode) script.parentNode.removeChild(script)
								clearRuntimeGlobal()
								settle(false)
								return
							}
							settle(true)
						}
						script.onerror = function (err) {
							if (settled) return
							runtimeState.loading = false
							runtimeState.failedRuntimeUrl = runtimeUrl
							if (script.parentNode) script.parentNode.removeChild(script)
							console.error("[RenderSite] runtime load failed", {
								runtimeUrl: runtimeUrl,
								err: err,
							})
							sendRuntimeErrorTelemetry({
								errorType: "runtimeLoad",
								message: "iframe runtime script load failed",
								runtimeUrl: runtimeUrl,
								detail: err ? String(err) : "",
							})
							settle(false)
						}

						if (document.head) document.head.appendChild(script)
						else if (document.documentElement)
							document.documentElement.appendChild(script)
						else settle(false)
					} catch (error) {
						if (settled) return
						runtimeState.loading = false
						runtimeState.failedRuntimeUrl = runtimeUrl
						console.error("[RenderSite] runtime injection failed", {
							runtimeUrl: runtimeUrl,
							error: error,
						})
						sendRuntimeErrorTelemetry({
							errorType: "runtimeLoad",
							message: "iframe runtime script injection failed",
							runtimeUrl: runtimeUrl,
							detail: error && error.message ? error.message : String(error),
						})
						settle(false)
					}
				})
				return runtimeState.loadingPromise
			}

			function ensureRuntime(runtimeUrl, scaleRatio) {
				var normalizedRuntimeUrl = typeof runtimeUrl === "string" ? runtimeUrl.trim() : ""
				if (normalizedRuntimeUrl)
					return loadIframeRuntime(normalizedRuntimeUrl, scaleRatio).then(
						function (loaded) {
							// Keep old/shared shells usable when the host-owned bundle is not
							// deployed yet. The inline runtime is the compatibility fallback.
							return loaded || installInlineRuntimeAndStart(scaleRatio)
						},
					)
				return Promise.resolve(installInlineRuntimeAndStart(scaleRatio))
			}

			function applyAnimationState() {
				var styleId = "magic-animation-pause"
				var existingStyle = document.getElementById(styleId)

				if (isAnimationPaused) {
					if (!existingStyle) {
						var style = document.createElement("style")
						style.id = styleId
						// Keep animation timelines intact: animation:none cancels them and
						// replays entrance effects when a cached slide becomes visible again.
						style.textContent =
							"*,*::before,*::after{animation-play-state:paused!important}"
						if (document.head) document.head.appendChild(style)
						else if (document.documentElement)
							document.documentElement.appendChild(style)
					}

					try {
						var videos = document.querySelectorAll("video")
						var audios = document.querySelectorAll("audio")

						videos.forEach(function (video) {
							if (!video.paused) video.setAttribute("data-was-playing", "true")
							video.pause()
							// Resident slides resume at the user's position after a page transition.
						})

						audios.forEach(function (audio) {
							if (!audio.paused) audio.setAttribute("data-was-playing", "true")
							audio.pause()
						})
					} catch (error) {
						console.warn("暂停媒体时出错:", error)
					}

					return
				}

				if (existingStyle) existingStyle.remove()

				try {
					var videosPlaying = document.querySelectorAll("video[data-was-playing='true']")
					var audiosPlaying = document.querySelectorAll("audio[data-was-playing='true']")

					videosPlaying.forEach(function (video) {
						video.removeAttribute("data-was-playing")
						video.play().catch(function (err) {
							console.log("视频自动播放被限制:", err.message)
						})
					})

					audiosPlaying.forEach(function (audio) {
						audio.removeAttribute("data-was-playing")
						audio.play().catch(function (err) {
							console.log("音频自动播放被限制:", err.message)
						})
					})
				} catch (error) {
					console.warn("恢复媒体播放时出错:", error)
				}
			}

			function setupClickListener() {
				document.addEventListener("click", function (event) {
					try {
						if (
							window.__editingAPIV2__ &&
							window.__elementSelectorV2__ &&
							window.__elementSelectorV2__.enabled
						)
							return

						window.parent.postMessage(
							{
								type: "documentClicked",
								target: event.target.tagName,
								x: event.clientX,
								y: event.clientY,
							},
							"*",
						)
					} catch (error) {
						console.error("发送点击事件消息时出错:", error)
					}
				})
			}

			var isEditMode = false

			function setupKeyboardListener() {
				document.addEventListener("keydown", function (event) {
					try {
						var isTargetEditable =
							event.target instanceof HTMLElement &&
							(event.target.isContentEditable ||
								event.target.tagName === "INPUT" ||
								event.target.tagName === "TEXTAREA")

						if (
							isEditMode ||
							isTargetEditable ||
							event.repeat ||
							(event.target instanceof Element &&
								event.target.closest(
									event.key === " "
										? "button,a,select,[role=button],[role=menuitem]"
										: "select,[role=menuitem]",
								))
						)
							return

						var key = event.key
						var direction = null

						switch (key) {
							case "ArrowLeft":
							case "ArrowUp":
							case "PageUp":
								direction = "prev"
								break
							case "ArrowRight":
							case "ArrowDown":
							case " ":
							case "PageDown":
								direction = "next"
								break
							case "Home":
								direction = "first"
								break
							case "End":
								direction = "last"
								break
							case "F11":
								direction = "fullscreen"
								break
							case "Escape":
								direction = "escape"
								break
						}

						if (direction) {
							event.preventDefault()
							window.parent.postMessage(
								{
									type: "keyboardEvent",
									direction: direction,
									originalKey: key,
									repeat: event.repeat,
								},
								"*",
							)
						}
					} catch (error) {
						console.error("发送键盘事件消息时出错:", error)
					}
				})
			}

			function measureElementMetric(element, metric) {
				if (!element || typeof element.getBoundingClientRect !== "function") return 0
				var rect = element.getBoundingClientRect()
				var rectValue = metric === "width" ? rect.width : rect.height
				var scrollKey = metric === "width" ? "scrollWidth" : "scrollHeight"
				var scrollValue = Number(element[scrollKey] || 0)
				return Math.max(rectValue || 0, scrollValue || 0)
			}

			function measureBodyChildrenMetric(metric) {
				var body = document.body
				if (!body) return 0
				return Array.prototype.slice.call(body.children || []).reduce(function (
					maxMetric,
					el,
				) {
					return Math.max(maxMetric, measureElementMetric(el, metric))
				}, 0)
			}

			function measureVerticalScrollbarWidth(hasVerticalOverflow) {
				if (!hasVerticalOverflow) return 0
				var docEl = document.documentElement
				var body = document.body
				var viewportWidth = window.innerWidth || 0
				var docClientWidth = docEl ? docEl.clientWidth : viewportWidth
				var bodyClientWidth = body ? body.clientWidth : docClientWidth
				var bodyOffsetWidth = body ? body.offsetWidth : bodyClientWidth
				return Math.max(
					0,
					Math.round(
						Math.max(viewportWidth - docClientWidth, bodyOffsetWidth - bodyClientWidth),
					),
				)
			}

			function measureContentMetrics() {
				var docEl = document.documentElement
				var body = document.body
				var viewportWidth = docEl ? docEl.clientWidth : window.innerWidth || 0
				var viewportHeight = docEl ? docEl.clientHeight : window.innerHeight || 0
				var overflowWidth = Math.max(
					docEl ? docEl.scrollWidth : 0,
					body ? body.scrollWidth : 0,
				)
				var overflowHeight = Math.max(
					docEl ? docEl.scrollHeight : 0,
					body ? body.scrollHeight : 0,
				)
				var bodyMetricWidth = measureElementMetric(body, "width")
				var bodyMetricHeight = measureElementMetric(body, "height")
				var childContentWidth = measureBodyChildrenMetric("width")
				var childContentHeight = measureBodyChildrenMetric("height")
				var intrinsicW = Math.max(childContentWidth, bodyMetricWidth)
				var intrinsicH = Math.max(childContentHeight, bodyMetricHeight)
				var contentWidth =
					overflowWidth > viewportWidth ? overflowWidth : intrinsicW || viewportWidth
				var contentHeight =
					overflowHeight > viewportHeight ? overflowHeight : intrinsicH || viewportHeight
				var hasVerticalOverflow = overflowHeight > viewportHeight
				return {
					contentWidth: Math.max(1, Math.ceil(contentWidth)),
					contentHeight: Math.max(1, Math.ceil(contentHeight)),
					hasHorizontalOverflow: overflowWidth > viewportWidth,
					hasVerticalOverflow: hasVerticalOverflow,
					verticalScrollbarWidth: measureVerticalScrollbarWidth(hasVerticalOverflow),
				}
			}

			function postContentMetrics(phase) {
				try {
					var metrics = measureContentMetrics()
					postToParent({
						type: "contentMetrics",
						phase: phase,
						contentWidth: metrics.contentWidth,
						contentHeight: metrics.contentHeight,
						hasHorizontalOverflow: metrics.hasHorizontalOverflow,
						hasVerticalOverflow: metrics.hasVerticalOverflow,
						verticalScrollbarWidth: metrics.verticalScrollbarWidth,
					})
				} catch (error) {
					console.error("发送contentMetrics消息时出错:", error)
				}
			}

			function scheduleContentMetrics(phase) {
				requestAnimationFrame(function () {
					requestAnimationFrame(function () {
						postContentMetrics(phase)
					})
				})
			}

			function setupDOMLoadListeners() {
				if (document.readyState === "loading") {
					document.addEventListener("DOMContentLoaded", function () {
						postToParent({ type: "domReady" })
						waitForRenderComplete()
					})
				} else {
					postToParent({ type: "domReady" })
					waitForRenderComplete()
				}

				if (document.readyState === "complete") {
					postToParent({ type: "pageFullyLoaded" })
					scheduleContentMetrics("settled")
				} else {
					window.addEventListener("load", function () {
						postToParent({ type: "pageFullyLoaded" })
						scheduleContentMetrics("settled")
					})
				}
			}

			function waitForRenderComplete() {
				requestAnimationFrame(function () {
					requestAnimationFrame(function () {
						postToParent({ type: "renderComplete" })
					})
				})
			}

			var slideBridgeScriptTagPattern =
				/<script\b(?=[^>]*\bsrc\s*=\s*(?:"[^"]*slide-bridge\.js(?:\?[^"]*)?"|'[^']*slide-bridge\.js(?:\?[^']*)?'|[^'">\s]*slide-bridge\.js(?:\?[^>\s]*)?))[^>]*>\s*<\/script\s*>/gi
			var runtimeScriptTagPattern =
				/<script\b(?=[^>]*\bdata-runtime\s*=\s*(?:"true"|'true'|true))[^>]*>[\s\S]*?<\/script\s*>/gi
			var runtimeInlinePlaceholderTagPattern =
				/<script\b(?=[^>]*\bid\s*=\s*(?:"magic-iframe-runtime-inline"|'magic-iframe-runtime-inline'))[^>]*>[\s\S]*?<\/script\s*>/gi

			function sanitizeContentForSandbox(content) {
				if (typeof content !== "string") {
					return content
				}

				if (
					content.indexOf("slide-bridge") === -1 &&
					content.indexOf("data-runtime") === -1 &&
					content.indexOf("magic-iframe-runtime-inline") === -1
				) {
					return content
				}

				return content
					.replace(slideBridgeScriptTagPattern, "")
					.replace(runtimeScriptTagPattern, "")
					.replace(runtimeInlinePlaceholderTagPattern, "")
			}

			function copyArticleSelectionToClipboard() {
				var body = document.body
				var selection = window.getSelection ? window.getSelection() : null
				if (!body || !selection || typeof document.execCommand !== "function") return false

				var comments = body.querySelector("[data-wechat-article-comments='true']")
				var range = document.createRange()
				if (comments) {
					range.setStart(body, 0)
					range.setEndBefore(comments)
				} else {
					range.selectNodeContents(body)
				}
				if (range.collapsed) return false

				var previousRanges = []
				for (var i = 0; i < selection.rangeCount; i += 1) {
					previousRanges.push(selection.getRangeAt(i).cloneRange())
				}
				var activeElement = document.activeElement
				var scrollX = window.scrollX || 0
				var scrollY = window.scrollY || 0

				try {
					selection.removeAllRanges()
					selection.addRange(range)
					window.focus()
					return document.execCommand("copy")
				} catch (error) {
					return false
				} finally {
					selection.removeAllRanges()
					for (var j = 0; j < previousRanges.length; j += 1) {
						selection.addRange(previousRanges[j])
					}
					try {
						if (activeElement && activeElement.focus)
							activeElement.focus({ preventScroll: true })
					} catch (error) {
						// Focus restoration is best-effort for detached article nodes.
					}
					try {
						window.scrollTo({ top: scrollY, left: scrollX, behavior: "auto" })
					} catch (error) {
						// Scroll restoration must not change the copy result.
					}
				}
			}

			function handleMessage(event) {
				try {
					if (!isTrustedParentMessage(event)) return

					if (event.data && event.data.type === "setContent") {
						var runtimeUrl = event.data.runtimeUrl
						var scaleRatio = event.data.scaleRatio
						ensureRuntime(runtimeUrl, scaleRatio)
							.then(function (runtimeReady) {
								if (!runtimeReady) {
									console.warn(
										"[RenderSite] content skipped: runtime unavailable",
									)
									postToParent({
										type: "contentLoadError",
										error: "runtime unavailable",
									})
									return
								}
								try {
									var locationSearch = event.data.locationSearch || ""
									var locationAnchor = event.data.locationAnchor || ""
									var navigationRequestId = event.data.navigationRequestId || ""
									var sanitizedContent = sanitizeContentForSandbox(
										event.data.content,
									)
									resetTelemetryDedupe()
									document.open()
									window.__MAGIC_HTML_NAVIGATION__ = {
										search: locationSearch,
										hash: locationAnchor,
										requestId: navigationRequestId,
									}
									try {
										window.history.replaceState(
											null,
											"",
											window.location.pathname +
												locationSearch +
												locationAnchor,
										)
									} catch (error) {
										console.warn(
											"Failed to update sandbox navigation state:",
											error,
										)
									}
									document.write(sanitizedContent)
									document.close()
									window.__MAGIC_HTML_NAVIGATION__ = {
										search: locationSearch,
										hash: locationAnchor,
										requestId: navigationRequestId,
									}
									if (!restartInlineRuntime())
										throw new Error(
											"iframe runtime restart failed after content injection",
										)
									setupMessageListener()
									setupClickListener()
									setupKeyboardListener()
									setupErrorHandler()
									setupDOMLoadListeners()
									applyAnimationState()
									postToParent({ type: "contentLoaded" })
									scheduleContentMetrics("initial")
								} catch (error) {
									console.error("[RenderSite] content apply failed", error)
									sendRuntimeErrorTelemetry({
										errorType: "contentApply",
										message: "sandbox content apply failed",
										detail:
											error && error.message ? error.message : String(error),
									})
									postToParent({
										type: "contentLoadError",
										error: "content apply failed",
									})
								}
							})
							.catch(function (error) {
								console.error("[RenderSite] content load failed", error)
								sendRuntimeErrorTelemetry({
									errorType: "contentLoad",
									message: "sandbox content load failed",
									detail: error && error.message ? error.message : String(error),
								})
								postToParent({
									type: "contentLoadError",
									error: "content load failed",
								})
							})
					} else if (
						isTrustedParentMessage(event) &&
						event.data &&
						event.data.type === "COPY_ARTICLE_SELECTION"
					) {
						postToParent({
							type: "COPY_ARTICLE_SELECTION_RESULT",
							requestId: event.data.requestId,
							success: copyArticleSelectionToClipboard(),
						})
					} else if (event.data && event.data.type === "setAnimationState") {
						isAnimationPaused = !!event.data.paused
						applyAnimationState()
					} else if (event.data && event.data.type === "editModeChange") {
						isEditMode = event.data.isEditMode
						if (!event.data.isEditMode && window.slideSelector)
							window.slideSelector.setEditMode(false)
					} else if (
						event.data &&
						event.data.version === "1.0.0" &&
						event.data.category === "event" &&
						event.data.type === "EDIT_MODE_CHANGED"
					) {
						if (
							event.data.payload &&
							typeof event.data.payload.isEditMode === "boolean"
						) {
							isEditMode = event.data.payload.isEditMode
							if (!isEditMode && window.slideSelector)
								window.slideSelector.setEditMode(false)
						}
					} else if (event.data && event.data.type === "loadEditRuntime") {
						loadIframeRuntime(event.data.runtimeUrl, event.data.scaleRatio)
					} else if (event.data && event.data.type === "injectEditScript") {
						try {
							window.__MAGIC_SCALE_RATIO__ = event.data.scaleRatio || 1
							var scriptV1 = document.createElement("script")
							scriptV1.setAttribute("data-injected", "true")
							scriptV1.textContent = event.data.scriptContent
							document.head.appendChild(scriptV1)
							if (window.slideSelector) {
								window.slideSelector.setEditMode(true)
								isEditMode = true
							}
						} catch (error) {
							console.error("注入编辑脚本失败:", error)
						}
					} else if (event.data && event.data.type === "injectEditScriptV2") {
						try {
							window.__MAGIC_SCALE_RATIO__ = event.data.scaleRatio || 1

							if (window.__iframeEditorRuntime__) {
								try {
									window.__iframeEditorRuntime__.destroy()
								} catch (e) {
									console.warn("清理旧的 EditorRuntime 失败:", e)
								}
								delete window.__iframeEditorRuntime__
							}

							if (window.__elementSelectorV2__) {
								try {
									window.__elementSelectorV2__.destroy()
								} catch (e) {
									console.warn("清理旧的 ElementSelector 失败:", e)
								}
								delete window.__elementSelectorV2__
							}

							if (window.__editingAPIV2__) delete window.__editingAPIV2__

							if (
								window.__editorBridge__ &&
								window.__editorBridge__.constructor.name === "SimpleEditorBridge"
							) {
								try {
									window.__editorBridge__.destroy()
								} catch (e) {
									console.warn("清理旧的 EditorBridge 失败:", e)
								}
								delete window.__editorBridge__
							}

							if (window.__EDITING_FEATURES_V2_INJECTED__)
								delete window.__EDITING_FEATURES_V2_INJECTED__

							var scriptV2 = document.createElement("script")
							scriptV2.setAttribute("data-injected", "true")
							scriptV2.textContent = event.data.scriptContent
							document.head.appendChild(scriptV2)

							setTimeout(function () {
								if (window.__editingAPIV2__) window.__editingAPIV2__.enable()
							}, 100)
						} catch (error) {
							console.error("注入 V2 编辑脚本失败:", error)
						}
					}
				} catch (error) {
					console.error("处理消息时出错:", error)
				}
			}

			setupMessageListener()
			setupKeyboardListener()
			setupErrorHandler()

			window.addEventListener("DOMContentLoaded", function () {
				try {
					postToParent({ type: "iframeReady" })
				} catch (error) {
					console.error("发送iframeReady消息时出错:", error)
				}
			})

			window.addEventListener("load", function () {
				try {
					postToParent({ type: "pageLoaded" })
					postToParent({ type: "iframeReady" })
				} catch (error) {
					console.error("发送pageLoaded消息时出错:", error)
				}
			})
		</script>
		<style>
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				display: flex;
				justify-content: center;
				align-items: center;
			}
			.loading {
				text-align: center;
			}
		</style>
	</head>
	<body>
		<div class="loading"></div>
	</body>
</html>
