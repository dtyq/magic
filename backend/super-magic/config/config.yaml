      currency: "USD"

agent:
  im_progress_initial_seconds: 60
  im_progress_max_seconds: 240
  # 只限制最终模型正文；预览先取前几行，再限制估算 token，单行也受限。
  tool_result:
    max_inline_tokens: 20000
    max_preview_lines: 5
    max_preview_tokens: 1000
  # Allow LLM to call multiple tools in a single response
  enable_multi_tool_calls: ${AGENT_ENABLE_MULTI_TOOL_CALLS:-true}
  # Execute multiple tool calls in parallel vs sequential (only applies when multi_tool_calls is enabled)
  enable_parallel_tool_calls: ${AGENT_ENABLE_PARALLEL_TOOL_CALLS:-false}
  # Timeout for parallel tool execution in seconds (None = no timeout)
  parallel_tool_calls_timeout: ${AGENT_PARALLEL_TOOL_CALLS_TIMEOUT:-None}
  # Whether the agent loop should auto-retry after non-terminal exceptions
  enable_agent_loop_retry: ${AGENT_ENABLE_AGENT_LOOP_RETRY:-false}

# Canvas 生成请求的 provider 并发上限
canvas:
  generation_max_concurrency: ${CANVAS_GENERATION_MAX_CONCURRENCY:-4}

# 图片生成服务配置
image_generator:
  text_to_image_platform: ${TEXT_TO_IMAGE_PLATFORM}
  text_to_image_api_base_url: ${TEXT_TO_IMAGE_API_BASE_URL}
  text_to_image_access_key: ${TEXT_TO_IMAGE_ACCESS_KEY}
  text_to_image_secret_key: ${TEXT_TO_IMAGE_SECRET_KEY}
  # 是否将本地参考图转换为 Base64 Data URL 后传给生图服务
  use_base64_reference_images: ${IMAGE_GENERATOR_USE_BASE64_REFERENCE_IMAGES:-false}
  image_to_image_model: ${IMAGE_TO_IMAGE_MODEL:-doubao-seedream-4-0-250828}
  text_to_image_model: ${TEXT_TO_IMAGE_MODEL:-doubao-seedream-4-0-250828}

# 视频生成服务配置
video_generator:
  # 是否将本地视频生成参考图片转换为 Base64 结构后传给视频生成服务
  use_base64_reference_images: ${VIDEO_GENERATOR_USE_BASE64_REFERENCE_IMAGES:-false}

bing:
  search_api_key: "${BING_SUBSCRIPTION_KEY}"
  search_endpoint: "${BING_SUBSCRIPTION_ENDPOINT:-https://api.bing.microsoft.com/v7.0}"

# Tavily 搜索 API 配置
tavily:
  api_key: "${TAVILY_API_KEY}"
  api_endpoint: "${TAVILY_API_ENDPOINT:-https://api.tavily.com}"
  search_endpoint: "${TAVILY_SEARCH_ENDPOINT:-/search}"

# Metaso 搜索 API 配置
metaso:
  api_key: "${METASO_API_KEY}"
  api_endpoint: "${METASO_API_ENDPOINT:-https://metaso.cn}"
  search_endpoint: "${METASO_SEARCH_ENDPOINT:-/api/v1/search}"

web_collector:
  api_token: "${WEB_COLLECTOR_API_TOKEN}"
  base_url: "${WEB_COLLECTOR_BASE_URL}"

# SerpApi 配置（用于 Google 搜索）
serpapi:
  api_key: "${SERPAPI_API_KEY}"
  api_endpoint: "${SERPAPI_API_ENDPOINT:-https://serpapi.com}"

# Magic 图片搜索服务配置
magic_image_search:
  api_key: "${MAGIC_IMAGE_SEARCH_API_KEY}"
  api_endpoint: "${MAGIC_IMAGE_SEARCH_ENDPOINT}"

# 搜索引擎选择
web_search:
  # 默认搜索引擎: bing, tavily, magic 或 metaso
  default_engine: "${WEB_SEARCH_DEFAULT_ENGINE:-magic}"

# 图片搜索引擎选择
image_search:
  # 默认图片搜索引擎: bing, serpapi 或 magic
  default_engine: "${IMAGE_SEARCH_DEFAULT_ENGINE:-magic}"

# 文件下载驱动选择
download:
  default_engine: "${DOWNLOAD_DEFAULT_ENGINE:-direct}"

# 网页抓取驱动选择
web_scrape:
  # 默认网页抓取驱动: browser 或 web_collector
  default_engine: "${WEB_SCRAPE_DEFAULT_ENGINE:-browser}"

# 截图驱动选择
screenshot:
  # 默认截图驱动: browser 或 web_collector
  default_engine: "${SCREENSHOT_DEFAULT_ENGINE:-browser}"

filebase:
  embedding_model_id: "${FILEBASE_EMBEDDING_MODEL_ID:-magic-embedding}"
  collection_prefix: "${FILEBASE_COLLECTION_PREFIX:-SUPERMAGIC-FILEBASE}"
  max_vectorization_concurrency: "${FILEBASE_MAX_VECTORIZATION_CONCURRENCY:-20}"
  max_embedding_retry_attempts: "${FILEBASE_MAX_EMBEDDING_RETRY_ATTEMPTS:-5}"

token_service:
  address: "${TOKEN_SERVICE_ADDRESS}"
  redis_uri: "${REDIS_URI}"
  app_id: "${APP_ID}"
  app_secret: "${APP_SECRET}"

qdrant:
  base_uri: "${QDRANT_BASE_URI}"
  api_key: "${QDRANT_API_KEY}"
  collection_prefix: "${QDRANT_COLLECTION_PREFIX:-SUPERMAGIC-}"
  filebase_prefix: "${QDRANT_FILEBASE_PREFIX:-SUPERMAGIC-FILEBASE-}"

# TikHub配置
tikhub:
  api_key: "${TIKHUB_API_KEY}"

# 存储服务配置
storage:
  # 火山引擎TOS配置
  tos:
    host: "${TOS_HOST}"
    policy: "${TOS_POLICY}"
    algorithm: "${TOS_ALGORITHM}"
    date: "${TOS_DATE}"
    credential: "${TOS_CREDENTIAL}"
    signature: "${TOS_SIGNATURE}"
    dir: "${TOS_DIR}"
    content_type: "${TOS_CONTENT_TYPE}"

sandbox:
  id: "${SANDBOX_ID:-}"
  app_env: "${APP_ENV:-dev}"
  # 是否为中国大陆部署，与 app_env 正交。默认 false 即海外；中国大陆集群设置 MAINLAND=true。
  mainland: "${MAINLAND:-false}"
  magic_authorization: "${MAGIC_AUTHORIZATION}"
  fetch_workspace: "${FETCH_WORKSPACE:-True}"
  # 是否启用 Agent 空闲监控。默认开启；本地可通过 ENABLE_AGENT_IDLE_MONITOR=false 关闭。
  idle_monitor_enabled: "${ENABLE_AGENT_IDLE_MONITOR:-true}"
  agent_idle_timeout: "${AGENT_IDLE_TIMEOUT:-1200}"
  idle_monitor_interval: "${IDLE_MONITOR_INTERVAL:-60}"
  shutdown:
    # 优雅退出超时：关闭服务时，等待已有连接和请求正常结束的最长时间。
    graceful_shutdown_timeout_seconds: "${SANDBOX_GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS:-10}"
    # 强制退出超时：从首次收到退出请求开始计时，到期仍未退出则强制结束进程。
    force_shutdown_timeout_seconds: "${SANDBOX_FORCE_SHUTDOWN_TIMEOUT_SECONDS:-25}"
  # 是否将 init_client_message 中的 authorization 转发为额外的 USER-Authorization header
  # true: API Key 使用 config.yaml 的 api_key，额外添加 USER-Authorization header（值为 authorization）
  # false: 标准 LLM 认证流程，只使用 config.yaml 的 api_key，不转发 USER-Authorization header
  forward_user_authorization: "${FORWARD_USER_AUTHORIZATION:-true}"

# 火山引擎语音配置
asr:
  app_id: "${ASR_VKE_APP_ID}"
  token: "${ASR_VKE_TOKEN}"
  cluster: "${ASR_VKE_CLUSTER}"
  secret_key: "${ASR_VKE_SECRET_KEY}"

# Magic-Space 配置
magic_space:
  api_key: "${MAGIC_SPACE_API_KEY}"
  api_base_url: "${MAGIC_SPACE_API_BASE_URL}"

# MDE 配置
mde:
  api_key: "${MDE_API_KEY}"
  api_base_url: "${MDE_API_BASE_URL}"

# PDF 理解服务配置
pdf_understanding:
  api_key: "${PDF_UNDERSTANDING_API_KEY}"
  api_url: "${PDF_UNDERSTANDING_API_URL}"

# 语音理解服务配置
audio_understanding:
  api_key: "${VOICE_UNDERSTANDING_API_KEY}"
  api_base_url: "${VOICE_UNDERSTANDING_API_BASE_URL}"
  # 连续查询失败达到此值才结束；合法响应后重置计数，不重发已提交任务。
  max_consecutive_query_failures: 5
  format_preparation_enabled: true
  duration_validation_enabled: true
  canonical_fallback_enabled: true
  max_fallback_attempts: 1

# Checkpoint管理配置
checkpoint:
  # 最大保留的checkpoint数量，实际保留 max_count + 1 个以支持撤回 max_count 个消息
  max_count: ${CHECKPOINT_MAX_COUNT:-3}

  # 是否启用自动清理功能
  auto_cleanup: ${CHECKPOINT_AUTO_CLEANUP:-true}

# 聊天记录统计与清理，作用于本地 .chat_history，随既有归档上传持久化。
chat_history_cleanup:
  completed_subagent_max_age_days: null
  completed_subagent_max_count: null
  compacted_max_age_days: null
  compacted_max_count: null
  total_max_bytes: null

# 完整排查存档的独立数量配额，运行期仍使用本地目录。
diagnostic_retention:
  llm_failed_max_count: 3
  memory_after_run_max_count: 3

# 两阶段范围编辑返回给模型的命中片段上限。
file_edit:
  range_preview_max_tokens: 2000
  range_preview_context_lines: 3

# .runtime 清理默认值。
# 容量字段支持 MB、MiB、KB、KiB 等写法；本项目的 MB 和 MiB 都按 1024 进制换算。
runtime_cleanup:
  # 发布前供审查的本地 Skill 快照；服务端准备凭据独立在 24 小时后过期。
  skill_publish:
    max_age_hours: 24
    max_directory_count: 32
    target_directory_count: 24
    max_total_size: 500MiB
    target_total_size: 400MiB

  # 自动结果文件由独立 owner 按容量和存活时间清理。
  tool_results:
    max_file_size: 8MiB
    max_file_count: 128
    target_file_count: 96
    max_total_size: 256MiB
    target_total_size: 192MiB
    max_age_days: 7

  bg_shell:
    max_age_days: 7
    max_file_count: 50
    target_file_count: 40
    max_total_size: 256MB
    target_total_size: 192MB
    max_file_size: 8MB
    head_keep_size: 1MB
    tail_keep_size: 1MB

  mcp_outputs:
    max_age_days: 7
    max_file_count: 128
    target_file_count: 96
    max_total_size: 256MB
    target_total_size: 192MB
    result_size_threshold: 8KB

  oauth2_callback:
    max_age_hours: 24
    max_file_count: 128
    target_file_count: 96

  snippets:
    max_age_days: 7
    max_file_count: 64
    target_file_count: 48
    max_total_size: 16MB
    target_total_size: 12MB

  # 原生视觉图片 Base64 的跨 run 复用缓存。
  # 一个缓存项最大约 512KB（data URL 上限）+ JSON 开销，512 项与 256MB 高水位大致对应。
  native_visual_cache:
    max_age_days: 7
    max_file_count: 512
    target_file_count: 384
    max_total_size: 256MB
    target_total_size: 192MB

  # 两阶段文件编辑的短期范围和失败内容，绑定当前 AgentContext。
  file_edits:
    max_age_days: 7
    max_file_count: 128
    target_file_count: 96
    max_total_size: 256MiB
    target_total_size: 192MiB

  llm_request:
    max_file_count: 10

  background_compact:
    max_age_days: 7

  memory_after_run:
    max_age_days: 7

  slide_template_maker:
    max_age_days: 3
    max_directory_count: 16

  # 追加问题的本地查询副本。产品查询仍走 magic-service。
  follow_up_suggestions:
    max_age_days: 7
    max_file_count: 64
    target_file_count: 48

# 启动任务：每次沙盒启动后在后台按顺序执行 .workspace/.magic/startup/ 下登记的脚本。
startup_task:
  # 单个任务默认与最大运行时长（秒）；最大值不能超过后台 shell 任务 1 小时的存活上限。
  default_timeout_seconds: 900
  max_timeout_seconds: 3600
  # 前台观察多久后转为后台任务；转后台后 Agent 可以用 shell_await 查看输出。
  background_after_seconds: 1

# Horizon 的展示额度与 5 MiB 文件扫描保护相互独立。
# 例：普通文件每份最多 4K，重要规则文件每份最多 16K；所有文件变化合计仍受 24K 约束。
# 整条通知还包含目录、浏览器和运行时事实，最后统一受 context_max_tokens 约束。
horizon:
  file_change_max_tokens: ${HORIZON_FILE_CHANGE_MAX_TOKENS:-4000}
  important_file_change_max_tokens: ${HORIZON_IMPORTANT_FILE_CHANGE_MAX_TOKENS:-16000}
  file_changes_max_tokens: ${HORIZON_FILE_CHANGES_MAX_TOKENS:-24000}
  context_max_tokens: ${HORIZON_CONTEXT_MAX_TOKENS:-32000}
  # 快照额度决定后续 Diff 可保留多少原文，不是单次读取或单次展示的额度。
  file_snapshot_max_tokens: ${HORIZON_FILE_SNAPSHOT_MAX_TOKENS:-128000}
  # 比较正文，diff 达到全文的此比例时优先真实读取全文；不计算包装的理解成本。
  full_read_ratio: ${HORIZON_FULL_READ_RATIO:-0.8}

# 默认挂载规则在应用层声明，来源优先级和实际文件读取仍由 Skill 加载器处理。
# mount_when 表示默认提供知识，allow_exclude 表示 Agent 能否排除，preload_files 表示直接展开正文。
# 例：关闭自动记忆不撤下 memory；用户主动要求整理时仍需要这些知识。
skills:
  runtime:
    - name: compact-chat-history
      mount_when: always
      allow_exclude: false
      preload_files: []
      disable_skill_on_preload_failure: false
    - name: memory
      mount_when: always
      allow_exclude: true
      preload_files: [SKILL.md]
      # 声明不等于加载成功；必需正文失败时只停用该 Skill，主任务继续。
      disable_skill_on_preload_failure: true
    - name: file-bundle
      mount_when: always
      allow_exclude: true
      preload_files: []
      disable_skill_on_preload_failure: false

# 文件记忆运行时配置
memory:
  memory_md:
    # 每份全局／普通项目主文件独立计算；目标不是最低长度，也不单独触发整理。
    target_tokens: ${MEMORY_MD_TARGET_TOKENS:-10000}
    # 严格超过才请求整体重组；只限制自动展示，不限制保存用户文件。
    max_tokens: ${MEMORY_MD_MAX_TOKENS:-16000}
  file_tree_change_context:
    # 从记忆根计算：日期文件在第 5 层，按 Skill 拆分的日内事件详情在第 6 层。
    scan_depth: ${MEMORY_FILE_TREE_SCAN_DEPTH:-6}
    # 只限制文件树首次发现和变更通知的上下文，不读取 notes 正文，不改变真实目录。
    max_tokens: ${MEMORY_FILE_TREE_CHANGE_CONTEXT_MAX_TOKENS:-2000}
    preferred_paths: [MEMORY.md, notes, notes/references, notes/timeline]
    # 偏好和时间目录只影响展示；未知命名仍参与扫描，不要求模型严格照模板建立目录。
    timeline_paths: [notes/timeline]
  after_run:
    # 这里只决定何时派生记忆任务，不决定每次是否全库整理；超限判断与整理政策分别在预算和 Skill。
    # 累计达到指定数量的有效主任务后触发一次完整 fork 提取
    extraction_task_threshold: ${MEMORY_AFTER_RUN_EXTRACTION_TASK_THRESHOLD:-5}
    # 未达到阈值时，连续 10 分钟无操作后触发一次完整 fork 提取
    extraction_idle_timeout_seconds: ${MEMORY_AFTER_RUN_EXTRACTION_IDLE_TIMEOUT_SECONDS:-600}

# 追加问题是允许失败的辅助生成，超时只限制后台请求，不推迟主任务完成通知。
follow_up_suggestions:
  # 达到 10 个有效循环迭代后提前生成；未达阈值的短任务在正常完成时生成。
  min_effective_loops: ${FOLLOW_UP_SUGGESTIONS_MIN_EFFECTIVE_LOOPS:-10}
  model_timeout_seconds: ${FOLLOW_UP_SUGGESTIONS_MODEL_TIMEOUT_SECONDS:-60}
  report_timeout_seconds: ${FOLLOW_UP_SUGGESTIONS_REPORT_TIMEOUT_SECONDS:-5}

# =====================================================
# AI Ability Configuration (AI能力配置)
# =====================================================
# AI能力配置管理各种AI能力（如视觉理解、信息精炼等）使用的模型和参数
# 支持环境变量占位符: ${ENV_VAR:-default_value}
# 配置优先级: magic-service runtime-config > config.yaml > 代码默认值
# =====================================================
ai_abilities:
  # Visual Understanding Ability (视觉理解能力)
  # Used for image analysis and visual content understanding
  visual_understanding:
    model_id: "${VISUAL_UNDERSTANDING_MODEL_ID:-qwen3.5-flash}"
    timeout: 120
    max_images: 10
    enabled: true

  # Summarize Ability (信息精炼能力)
  # Used for text summarization and information extraction
  summarize:
    model_id: "${SUMMARIZE_MODEL_ID:-qwen3.5-flash}"
    default_target_length: 500
    enabled: true

  # Smart Filename Ability (智能文件名生成能力)
  # Used for generating smart filenames from webpage titles
  smart_filename:
    model_id: "${SMART_FILENAME_MODEL_ID:-deepseek-v4-flash}"
    timeout: 60
    enabled: true

  # Purify Ability (内容净化能力)
  # Used for content purification and cleaning
  purify:
    model_id: "${PURIFY_MODEL_ID:-deepseek-v4-flash}"
    max_tokens: 24000
    enabled: true

  # Deep Write Ability (深度写作能力)
  # Used for deep content writing with references
  deep_write:
    model_id: "${DEEP_WRITE_MODEL_ID:-deepseek-v4-flash}"
    temperature: 0.7
    min_reference_files: 3
    enabled: true

  # Analysis Audio Ability (音频分析能力)
  # Used for analyzing audio project content
  analysis_audio:
    model_id: "${ANALYSIS_AUDIO_MODEL_ID:-qwen3.5-flash}"
    enabled: true

  # Video Understanding Ability (视频理解能力)
  # Used for analyzing video content
  video_understanding:
    model_id: "${VIDEO_UNDERSTANDING_MODEL_ID:-qwen3.5-flash}"
    timeout: ${VIDEO_UNDERSTANDING_TIMEOUT:-600}
    enabled: true

  # Analysis Slide Ability (网页/幻灯片分析能力)
  # Used for analyzing webpage/slide content
  analysis_slide:
    model_id: "${ANALYSIS_SLIDE_MODEL_ID:-deepseek-v4-flash}"
    timeout: 60
    enabled: true

  # Compact Ability (上下文压缩能力)
  # 压缩触发时临时切换到此模型，压缩完成后恢复原模型
  # 不配置 model_id（或设为空）时，沿用主 Agent 当前模型
  compact:
    model_id: "${COMPACT_MODEL_ID:-deepseek-v4-flash}"

  # Skill Candidate Selection Ability (Skill 候选选择能力)
  skill_rerank:
    model_id: "${SKILL_RERANK_MODEL_ID:-deepseek-v4-flash}"

  # Agent Candidate Ranking Ability (Agent 候选排序能力)
  agent_rerank:
    model_id: "${AGENT_RERANK_MODEL_ID:-deepseek-v4-flash}"

  # Validate candidates produced by JSON repair before tool execution
  json_repair_validation:
    model_id: "${JSON_REPAIR_VALIDATION_MODEL_ID:-deepseek-v4-flash}"
    timeout: 30
    max_advice_words: 50
    enabled: true

  # 记忆提取能力
  # 当前仅保留能力配置，供后续 AFTER_MAIN_AGENT_RUN 提取机制使用
  memory:
    model_id: "${MEMORY_MODEL_ID:-deepseek-v4-flash}"

  # 人设访谈能力：persona_chat 工具扮演 AI 受访者回答访谈问题
  persona_chat:
    model_id: "${PERSONA_CHAT_MODEL_ID:-}"

# =====================================================
# Web Scraping 网页爬取配置
# =====================================================
web_scraping:
  # 是否启用 SearchAPI 作为降级方案 (当无头浏览器遇到反爬虫时使用)
  enable_search_api_fallback: ${WEB_SCRAPING_ENABLE_API_FALLBACK:-true}

  # SearchAPI 配置 (第三方网页爬取服务)
  search_api:
    # API 端点地址
#    endpoint: ${SEARCH_API_ENDPOINT:-https://searchapi.cloudsway.net/search/HcAMcybqJTnDtGiJ/read}
    # API Token (必须通过环境变量 MAGIC_API_KEY 设置, 走magic-service代理)
    token: ${MAGIC_API_KEY}
    # 爬取模式: quality (质量优先) 或 speed (速度优先)
    mode: ${SEARCH_API_MODE:-quality}
    # 请求超时时间(秒)
    timeout: ${SEARCH_API_TIMEOUT:-30}

  # 内容验证配置 (用于检测反爬虫/无效内容)
  content_validation:
    # 是否启用反爬虫关键词检测
    enable_anti_crawler_detection: ${WEB_SCRAPING_ENABLE_ANTI_CRAWLER_DETECTION:-true}
    # 最小有效内容长度 (字符)
    min_content_length: ${WEB_SCRAPING_MIN_CONTENT_LENGTH:-50}
    # 最小有效文本长度 (去除HTML后, 字符)
    min_text_length: ${WEB_SCRAPING_MIN_TEXT_LENGTH:-100}
