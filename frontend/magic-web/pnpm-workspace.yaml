# NOTE: `enterprise/` is intentionally NOT a workspace member. It is a
# standalone install root with its own pnpm-workspace.yaml and pnpm-lock.yaml,
# so this (open-source) lockfile never references commercial dependencies.
packages:
  - "packages/browser-apm"
  - "packages/magic-admin"
  - "packages/magic-admin-v2"
  - "packages/html2pptx"
  - "packages/html2image"
  - "packages/magic-widget-sdk"
  - "packages/html-sandbox"
  - "packages/x-markdown"

overrides:
  "@dtyq/magic-flow>react": 18.3.1
  "@dtyq/magic-flow>react-dom": 18.3.1
  # Tiptap's official v3 packages share runtime APIs and must stay on one
  # release. Keep this list explicit: @tiptap/y-tiptap is also official but
  # has an independent version line, while non-@tiptap editor packages are
  # third-party or workspace integrations and must retain their own versions.
  "@tiptap/core": 3.11.1
  "@tiptap/extension-blockquote": 3.11.1
  "@tiptap/extension-bold": 3.11.1
  "@tiptap/extension-bubble-menu": 3.11.1
  "@tiptap/extension-bullet-list": 3.11.1
  "@tiptap/extension-code": 3.11.1
  "@tiptap/extension-code-block": 3.11.1
  "@tiptap/extension-collaboration": 3.11.1
  "@tiptap/extension-color": 3.11.1
  "@tiptap/extension-document": 3.11.1
  "@tiptap/extension-drag-handle": 3.11.1
  "@tiptap/extension-drag-handle-react": 3.11.1
  "@tiptap/extension-dropcursor": 3.11.1
  "@tiptap/extension-floating-menu": 3.11.1
  "@tiptap/extension-gapcursor": 3.11.1
  "@tiptap/extension-hard-break": 3.11.1
  "@tiptap/extension-heading": 3.11.1
  "@tiptap/extension-highlight": 3.11.1
  "@tiptap/extension-history": 3.11.1
  "@tiptap/extension-horizontal-rule": 3.11.1
  "@tiptap/extension-image": 3.11.1
  "@tiptap/extension-italic": 3.11.1
  "@tiptap/extension-link": 3.11.1
  "@tiptap/extension-list": 3.11.1
  "@tiptap/extension-list-item": 3.11.1
  "@tiptap/extension-list-keymap": 3.11.1
  "@tiptap/extension-mathematics": 3.11.1
  "@tiptap/extension-mention": 3.11.1
  "@tiptap/extension-node-range": 3.11.1
  "@tiptap/extension-ordered-list": 3.11.1
  "@tiptap/extension-paragraph": 3.11.1
  "@tiptap/extension-placeholder": 3.11.1
  "@tiptap/extension-strike": 3.11.1
  "@tiptap/extension-subscript": 3.11.1
  "@tiptap/extension-superscript": 3.11.1
  "@tiptap/extension-table": 3.11.1
  "@tiptap/extension-text": 3.11.1
  "@tiptap/extension-text-align": 3.11.1
  "@tiptap/extension-text-style": 3.11.1
  "@tiptap/extension-typography": 3.11.1
  "@tiptap/extension-underline": 3.11.1
  "@tiptap/extensions": 3.11.1
  "@tiptap/pm": 3.11.1
  "@tiptap/react": 3.11.1
  "@tiptap/starter-kit": 3.11.1
  "@tiptap/suggestion": 3.11.1
  "@types/react": 18.3.23
  "@types/react-dom": 18.3.7
  "lucide-react": "0.577.0"
  "@tabler/icons-react": "3.46.0"
  esbuild: 0.24.0
  # @dtyq/eslint-config@0.0.11 still targets ESLint 8 + typescript-eslint 5.
  # Without this pin, autoInstallPeers pulls eslint@9 into packages that omit
  # a direct eslint dependency (e.g. magic-admin) and mixes incompatible plugins.
  eslint: 8.57.1
  katex: 0.16.21
  marked: 15.0.12
