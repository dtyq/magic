# =====================================================
# Super Magic 配置文件
# =====================================================
# 重要安全提示:
# 1. 敏感的模型ID（如 ep-xxxxxxxxxx 格式的ID）应该只在 .env 文件中定义
# 2. 配置文件中应该使用人类可读的默认值（如 doubao-pro-32k）
# 3. 真实的模型ID应该通过环境变量在运行时注入
# 4. 此文件会被提交到Git，不要在此文件中暴露任何敏感信息
# =====================================================

browser:
  # 浏览器后端：local_playwright、remote_playwright 或 chrome_extension。
  # 未配置时，本地环境使用 local_playwright，其他环境使用 remote_playwright。
  # chrome_extension 必须由受保护的产品配对流程注入 TunnelProvider，不能直接作为普通默认配置启动。
  backend: ${BROWSER_BACKEND:-None}
  browser_type: ${BROWSER_TYPE:-chromium}
  headless: ${BROWSER_HEADLESS:-false}
  # 关闭 Blink 自动化标记，使 navigator.webdriver 使用浏览器原生的 false。
  browser_args:
    - --disable-blink-features=AutomationControlled
  storage_state_template_url: ${BROWSER_STORAGE_STATE_TEMPLATE_URL:-None}
  viewport_width: ${BROWSER_VIEWPORT_WIDTH:-1280}
  viewport_height: ${BROWSER_VIEWPORT_HEIGHT:-1940}
  device_scale_factor: ${BROWSER_DEVICE_SCALE_FACTOR:-2}
  locale: ${BROWSER_LOCALE:-zh-CN}
  timezone_id: ${BROWSER_TIMEZONE_ID:-Asia/Shanghai}
  default_timeout: ${BROWSER_DEFAULT_TIMEOUT:-30000}
  navigation_timeout: ${BROWSER_NAVIGATION_TIMEOUT:-30000}
  script_timeout: ${BROWSER_SCRIPT_TIMEOUT:-10000}
  action_settle_timeout: ${BROWSER_ACTION_SETTLE_TIMEOUT:-150}
  load_timeout: ${BROWSER_LOAD_TIMEOUT:-3000}
  event_buffer_size: ${BROWSER_EVENT_BUFFER_SIZE:-1000}
  diagnostic_buffer_size: ${BROWSER_DIAGNOSTIC_BUFFER_SIZE:-1000}
  bypass_csp: ${BROWSER_BYPASS_CSP:-true}
  ignore_https_errors: ${BROWSER_IGNORE_HTTPS_ERRORS:-true}
  accept_downloads: ${BROWSER_ACCEPT_DOWNLOADS:-true}

  lifecycle:
    page_idle_seconds: ${BROWSER_PAGE_IDLE_SECONDS:-600}
    page_keep_alive_max_seconds: ${BROWSER_PAGE_KEEP_ALIVE_MAX_SECONDS:-3600}
    context_idle_seconds: ${BROWSER_CONTEXT_IDLE_SECONDS:-120}
    host_idle_seconds: ${BROWSER_HOST_IDLE_SECONDS:-120}
    sweep_interval_seconds: ${BROWSER_LIFECYCLE_SWEEP_INTERVAL_SECONDS:-5}

  screenshot:
    webp_quality: ${BROWSER_WEBP_QUALITY:-82}
    webp_min_quality: ${BROWSER_WEBP_MIN_QUALITY:-58}
    webp_quality_step: ${BROWSER_WEBP_QUALITY_STEP:-6}
    target_bpp: ${BROWSER_SCREENSHOT_TARGET_BPP:-0.5}
    min_bytes: ${BROWSER_SCREENSHOT_MIN_BYTES:-131072}
    max_bytes: ${BROWSER_SCREENSHOT_MAX_BYTES:-262144}
    max_width: ${BROWSER_SCREENSHOT_MAX_WIDTH:-1600}
    max_height_ratio: ${BROWSER_SCREENSHOT_MAX_HEIGHT_RATIO:-1.6}
    resize_step: ${BROWSER_SCREENSHOT_RESIZE_STEP:-0.85}
    min_dimension: ${BROWSER_SCREENSHOT_MIN_DIMENSION:-1280}

  resources:
    soft_contexts: ${BROWSER_SOFT_CONTEXTS:-8}
    hard_contexts: ${BROWSER_HARD_CONTEXTS:-12}
    soft_pages: ${BROWSER_SOFT_PAGES:-24}
    hard_pages: ${BROWSER_HARD_PAGES:-32}

  scripts:
    mask_enabled: ${BROWSER_MASK_ENABLED:-true}
    pure_enabled: ${BROWSER_PURE_ENABLED:-true}
    # 按需在 config.local.yaml 填写域名列表。
    pure_disabled_domains: []
    lens_enabled: ${BROWSER_LENS_ENABLED:-true}
    marker_enabled: ${BROWSER_MARKER_ENABLED:-true}
    # 显式目录列表；目录不存在或为空时不改变默认页面行为。
    userscript_directories:
      - magic_use/userscripts/scripts

  elements:
    max_nodes: ${BROWSER_ELEMENTS_MAX_NODES:-500}
    max_depth: ${BROWSER_ELEMENTS_MAX_DEPTH:-30}

  # 浏览器服务端 WebSocket URL
  # 仅在 backend=remote_playwright 时生效
  # 示例: ws://127.0.0.1:3000 (本地服务端)
  # 示例: ws://browser-server.example.com:3000 (远程服务端)
  # 环境变量: BROWSER_SERVER_URL
  browser_server_url: ${BROWSER_SERVER_URL:-ws://127.0.0.1:3000}

  # 服务端健康检查超时时间（秒）
  # 默认: 60
  # 环境变量: BROWSER_SERVER_HEALTH_CHECK_TIMEOUT
  server_health_check_timeout: ${BROWSER_SERVER_HEALTH_CHECK_TIMEOUT:-60}

  # 服务端健康检查重试间隔（秒）
  # 默认: 1.0
  # 环境变量: BROWSER_SERVER_HEALTH_CHECK_INTERVAL
  server_health_check_interval: ${BROWSER_SERVER_HEALTH_CHECK_INTERVAL:-1.0}

  # 服务端连接超时时间（毫秒）
  # 默认: 30000 (30秒)
  # 环境变量: BROWSER_SERVER_CONNECT_TIMEOUT
  server_connect_timeout: ${BROWSER_SERVER_CONNECT_TIMEOUT:-30000}

# LLM API 通用配置
llm:
  api_timeout: ${LLM_API_TIMEOUT:-600}
  api_max_retries: ${LLM_API_MAX_RETRIES:-3}
  # 自定义API请求头配置 - 所有请求头都从环境变量读取
  custom_api_headers: ${LLM_CUSTOM_API_HEADERS:-None}
  # 允许携带 Magic/User Authorization 的 LLM base_url，逗号分隔；MAGIC_API_BASE_URL 会自动加入允许范围
  auth_header_base_urls: ${LLM_AUTH_HEADER_BASE_URLS:-None}
  # 两阶梯重试策略
  # 第一阶梯：流式
  # > 设 600s 等同于禁用 per-chunk 超时检测，由总超时兜底
  # > 原因：Claude/AWS 渠道流式卡顿后仍可恢复，缩短此值会误杀正常请求 2026-04-12
  stream_first_chunk_timeout_seconds: 600  # 首包超时
  stream_chunk_timeout_seconds: 600        # chunk 间隔超时
  # 第二阶梯：非流式退避重试
  non_stream_timeout_seconds: 600          # 非流式请求超时
  backoff_max_retries: 5                   # 最大退避重试次数

# 用户可见上下文窗口配置
#
# 这里配置的是产品对外展示和压缩策略共同使用的上下文窗口档位。
# Python 只负责按模型关键词匹配档位，并用 context_usage_ratio 计算压缩阈值。
context_window:
  default_user_facing_max_context_tokens: 200000
  compaction:
    default_compaction_threshold_tokens: 180000
    min_compaction_threshold_tokens: 100000
    max_compaction_threshold_tokens: 180000
    context_usage_ratio: 0.9
  tiers:
    # 200K 档：产品对外按 200K 展示，压缩阈值由 context_usage_ratio 派生。
    # Claude 关键词同时兼容两种命名顺序（历史遗留的命名不规范问题）。
    - name: context_window_200k
      user_facing_max_context_tokens: 200000
      model_keywords:
        - claude-sonnet-4.6
        - claude-4.6-sonnet
        - claude-opus-4.6
        - claude-4.6-opus
        - claude-sonnet-4.5
        - claude-4.5-sonnet
        - claude-sonnet-4
        - claude-4-sonnet
        - gemini-3-pro
        - gemini-3-pro-preview
        - gemini-3.1-pro
        - gemini-3.1-pro-preview
        # Step / MiMo 系列上下文窗口待确认，先保守归入 200K 档。
        - step-3.5-flash
        - mimo-v2.5

    # 256K 档：产品对外按 256K 展示，压缩阈值由 context_usage_ratio 派生。
    # 子串匹配：如 gpt-5.x 覆盖 mini/nano，doubao-seed-2.0 覆盖 pro/lite/code。
    - name: context_window_256k
      user_facing_max_context_tokens: 256000
      model_keywords:
        - claude-opus-4.8
        - gpt-5.5
        - gpt-5.4
        - glm-5.2
        - qwen3.7-max
        - qwen3.7-plus
        - qwen3.6-plus
        - qwen3.5-plus
        - qwen3.5-flash
        - qwen-plus
        - doubao-seed-2.0
        - deepseek-v4
        - deepseek-v4-flash
        - kimi-k2
        - gemini-3-flash

# 自定义默认模型。没有管理后台模型列表时，auto 必须能在 providers.*.models 中解析到。
default_model: auto

providers:
  custom:
    client_type: openai_chat_completions
    base_url: "${CUSTOM_LLM_API_BASE_URL:-https://api.deepseek.com/v1}"
    api_key: "${CUSTOM_LLM_API_KEY}"
    models:
      auto:
        api_model: "${CUSTOM_LLM_MODEL:-deepseek-v4-flash}"
        # 为空时按 api_model 查 model_profiles；需要指定其它 profile 时由 CUSTOM_LLM_PROFILE 覆盖。
        profile: "${CUSTOM_LLM_PROFILE:-}"
        max_context_tokens: "${CUSTOM_LLM_MAX_CONTEXT_TOKENS:-}"
        max_output_tokens: "${CUSTOM_LLM_MAX_OUTPUT_TOKENS:-}"

  deepseek:
    client_type: openai_chat_completions
    base_url: "${DEEPSEEK_V4_FLASH_API_BASE_URL:-https://api.deepseek.com}"
    api_key: "${DEEPSEEK_V4_FLASH_API_KEY}"
    models:
      deepseek-v4-flash:
        api_model: "${DEEPSEEK_V4_FLASH_MODEL:-deepseek-v4-flash}"
        profile: "deepseek-v4-flash"

  qwen:
    client_type: openai_chat_completions
    base_url: "${QWEN3_7_PLUS_API_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
    api_key: "${QWEN3_7_PLUS_API_KEY}"
    models:
      qwen3.7-plus:
        api_model: "${QWEN3_7_PLUS_MODEL:-qwen3.7-plus}"
        profile: "qwen3.7-plus"
      qwen3.5-flash:
        api_model: "${QWEN3_5_FLASH_MODEL:-qwen3.5-flash}"
        profile: "qwen3.5-flash"

  local_embedding:
    client_type: openai_chat_completions
    base_url: "${LOCAL_EMBEDDING_API_BASE_URL:-https://api.openai.com/v1}"
    api_key: "${LOCAL_EMBEDDING_API_KEY}"
    models:
      magic-embedding:
        type: "embedding"
        api_model: "${LOCAL_EMBEDDING_MODEL:-text-embedding-3-large}"
        profile: "text-embedding-3-large"

