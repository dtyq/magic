# shoule match .github/workflows/build-*.yml
images:
  magic-service:
    context: ./backend/magic-service
  magic-gateway:
    context: ./backend/magic-gateway
  super-magic:
    context: ./backend/super-magic
  sandbox-components:
    context: ./backend/sandbox-components
  magic-web:
    context: ./frontend/magic-web
  playwright-mod:
    context: ./thirdparty/playwright-mod
# shoule match paths in .github/workflows/subtree-publish.yml
subtrees:
  api-response:
    prefix: backend/api-response
  async-event:
    prefix: backend/async-event
  cloudfile:
    prefix: backend/cloudfile
  code-executor:
    prefix: backend/code-executor
  easy-dingtalk:
    prefix: backend/easy-dingtalk
  flow-expr-engine:
    prefix: backend/flow-expr-engine
  rule-engine-core:
    prefix: backend/rule-engine-core
  sdk-base:
    prefix: backend/sdk-base
  task-scheduler:
    prefix: backend/task-scheduler
  sandbox:
    prefix: thirdparty/PHPSandbox
  tiptap:
    prefix: thirdparty/tiptap
